name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install bcftools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bcftools patch
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Verify pinned upstream bytes
        run: python scripts/verify_vendor.py
      - name: Lint
        run: ruff format --check . && ruff check .
      - name: Test
        run: pytest --cov=genome_annotation_builder --cov-report=term-missing --cov-fail-under=60
      - name: Privacy gate
        run: python scripts/privacy_scan.py --tracked
      - name: Build distributions
        env:
          SOURCE_DATE_EPOCH: "1786924800"
        run: |
          python -m build
          python scripts/verify_distributions.py dist
          python -m build --outdir dist-repro
          python scripts/verify_distributions.py dist-repro
          python scripts/verify_reproducible_distributions.py dist dist-repro
      - name: Test source distribution
        run: |
          mkdir -p .ci-sdist
          tar -xzf dist/*.tar.gz -C .ci-sdist
          sdist_root="$(find .ci-sdist -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "${sdist_root}"
          (
            cd "${sdist_root}"
            PYTHONPATH=src pytest -q --disable-warnings
          )
      - name: Test clean wheel install
        run: |
          python -m venv .ci-wheel
          .ci-wheel/bin/python -m pip install --upgrade pip
          .ci-wheel/bin/python -m pip install dist/*.whl
          .ci-wheel/bin/python -m pip check
          .ci-wheel/bin/genome-annotation-builder --version
          .ci-wheel/bin/genome-annotation-builder release-c project-release --help
